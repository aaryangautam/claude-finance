[project]
name = "claude-finance"
version = "0.1.0"
description = "Local-first personal finance for Claude Code: Plaid + pluggable providers -> SQLite, deterministic pipelines, an Obsidian plan layer"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "plaid-python>=25.0.0",
    "requests>=2.32",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-frontmatter>=1.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
finance = "finance.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
